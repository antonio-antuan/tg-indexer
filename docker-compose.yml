services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: tgi
      POSTGRES_DB: tgi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: --locale=en_US.utf8
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tgi -d tgi"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
