[project]
name = "tg-indexer"
version = "0.1.0"
description = "Personal Telegram archive (TDLib) with keyword + LLM search"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28",
    "mcp>=2.3",
    "psycopg[binary]>=3.2",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
tgi = "tgi.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8",
    "pyyaml>=6",
    "ruff>=0.6",
    "types-pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tgi"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S608"]

[tool.mypy]
strict = true
files = ["tgi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
